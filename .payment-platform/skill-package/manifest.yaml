package:
  name: enterprise-payment-platform-skills
  version: 1.0.0
  generated_at: '2026-08-18'
  language: zh-CN
  license: MIT
  hosts:
  - Codex .agents/skills
  - Claude Code .claude/skills
product:
  name: Enterprise Payment Orchestration Platform
  default_profile: full-multi-project
  priority_providers:
  - WeChat Pay APIv3
  - Alipay certificate mode
  global_providers:
  - Stripe
  - PayPal
  - Apple Pay via PSP by default
  regulated_boundary: 技术编排与商户直连结算；默认禁止平台自有资金池、储值余额、无牌代收代付和跨商户清算。
technology_defaults:
  runtime: Java 25 LTS
  framework: Spring Boot 4.1.x
  database: PostgreSQL 18.x
  orchestration: Kubernetes 1.36.x
  messaging: Kafka-compatible durable event log
  cache: Redis-compatible ephemeral cache only
  observability: OpenTelemetry
  secrets: KMS/HSM/Vault abstraction
  frontend: TypeScript web admin and hosted checkout with strict CSP
security_baselines:
- PCI DSS 4.0.1 scope minimization and evidence
- OWASP Top 10 2025, ASVS, API Security Top 10 2023, MASVS, WSTG
- NIST SP 800-207 Zero Trust and SP 800-218 SSDF
- NIST SP 800-63B-4 and W3C WebAuthn for phishing-resistant access
- Provider official signature verification, idempotency and webhook rules
- No raw PAN, CVV, track data, or reusable wallet plaintext in platform storage
release_gates:
  RG0: package integrity and skill validation
  RG1: all batch evidence valid
  RG2: payment and ledger invariants pass
  RG3: provider sandbox/certification pass
  RG4: security and penetration gates pass
  RG5: backup, restore and disaster recovery pass
  RG6: reconciliation and finance UAT pass
  RG7: independent review and production sign-off

  static-analysis:
    name: 'CodeQL 源码扫描、构建检查与真实沙箱 DAST'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24.9.0'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: java-kotlin,javascript-typescript,python
          queries: security-extended
      - name: '执行 CodeQL security-extended、编译检查与真实沙箱 DAST；告警即阻断，未验收时不宣称生产源码 SAST 已通过 (1/2)'
        run: |
          ./gradlew --no-daemon check -x test --no-build-cache --rerun-tasks
      - name: '执行 CodeQL security-extended、编译检查与真实沙箱 DAST；告警即阻断，未验收时不宣称生产源码 SAST 已通过 (2/2)'
        run: |
          python3 -m tools.paygov.cli verify module-registry --repo . --out build/static-analysis.json
      - name: Build the real local sandbox distribution
        id: native-dist
        run: ./gradlew --no-daemon :apps:edge-gateway:installDist
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          output: build/rr02/codeql
          upload: never
      - name: Require successful CodeQL execution and zero findings
        run: python3 scripts/rr02-security.py sarif build/rr02/codeql --out build/rr02/sast.json
      - name: Probe the built Java and Node sandbox
        if: always() && steps.native-dist.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rr02
          ELMPAY_DEMO_ENABLED=true ELMPAY_DEMO_REAL_PAYMENTS_DISABLED=true \
          ELMPAY_DEMO_PUBLIC_ORIGIN=https://elmpay.vercel.app \
          ELMPAY_DEMO_JAVA_PATH="${JAVA_HOME}/bin/java" PORT=10000 \
          node apps/free-demo/src/start.mjs > build/rr02/native-runtime.log 2>&1 &
          demo_pid=$!
          trap 'kill -TERM "${demo_pid}" 2>/dev/null || true; wait "${demo_pid}" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:10000/health/ready', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          python3 scripts/rr02-security.py dast http://127.0.0.1:10000 --out build/rr02/dast.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: source-security-artifacts
          path: build/rr02/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: static-analysis-artifacts
          path: |
            build/static-analysis.json
          if-no-files-found: error


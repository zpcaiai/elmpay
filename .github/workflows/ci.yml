          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true
      - name: '运行 tools/tests、testing 产品面、128 批次本地矩阵、渠道矩阵、checkout/admin Web、server SDK 与含 Android 的根 Gradle 测试，禁止跳过关键测试 (1/8)'

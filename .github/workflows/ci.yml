      - name: '运行 tools/tests、testing 产品面、128 批次本地矩阵、渠道矩阵、checkout/admin Web、server SDK 与含 Android 的根 Gradle 测试，禁止跳过关键测试 (2/8)'
        run: |
          mkdir -p build/test-surfaces && python3 -m unittest discover -s testing -p 'test_*.py' -v > build/test-surfaces/testing.log 2>&1
      - name: '运行 tools/tests、testing 产品面、128 批次本地矩阵、渠道矩阵、checkout/admin Web、server SDK 与含 Android 的根 Gradle 测试，禁止跳过关键测试 (3/8)'

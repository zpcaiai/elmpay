      - name: '以固定工具链构建声明的 Gradle leaf，并生成待签名制品 manifest (1/2)'
        run: |
          ./gradlew --no-daemon --console=plain build -x test
      - name: '以固定工具链构建声明的 Gradle leaf，并生成待签名制品 manifest (2/2)'
        run: |
          scripts/stage-signing-artifacts.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0

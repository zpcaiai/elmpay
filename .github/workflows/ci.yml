      - name: '运行 tools/tests、testing 产品面、128 批次本地矩阵、渠道矩阵、checkout/admin Web、server SDK 与含 Android 的根 Gradle 测试，禁止跳过关键测试 (4/8)'
        run: |
          node --test apps/checkout-web/test/*.test.mjs > build/test-surfaces/checkout-web.log 2>&1
      - name: '运行 tools/tests、testing 产品面、128 批次本地矩阵、渠道矩阵、checkout/admin Web、server SDK 与含 Android 的根 Gradle 测试，禁止跳过关键测试 (5/8)'

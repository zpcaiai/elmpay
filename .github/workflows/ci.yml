          cache-read-only: true
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        id: dependency-check-cache
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: dependency-check-13.0.0-data-11.0-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |

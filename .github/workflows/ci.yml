      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '为每个制品生成 SBOM 并随制品一同归档 (1/1)'
        run: |
          ./gradlew --no-daemon cyclonedxBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sbom-artifacts
          path: |
            build/reports/bom.json
          if-no-files-found: warn

  sign:
    name: '制品签名与来源证明'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [sbom, unit-test, static-analysis, dependency-scan, container-scan, iac-scan, secret-scan]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '对制品与镜像签名并生成 SLSA provenance (1/1)'
        run: |
          scripts/sign-artifacts.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sign-artifacts
          path: |
            build/provenance.intoto.jsonl
            build/signatures/
          if-no-files-found: warn

  negative-controls:
    name: '运行期 fail-closed 验证'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [governance]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '以真实 CLI 对被破坏的治理面验证门禁确实会失败 (1/1)'
        run: |
          python3 scripts/negative-controls.py > negative-controls.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: negative-controls-artifacts
          path: |
            negative-controls.log
          if-no-files-found: warn

  evidence-archive:
    name: '证据归档'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [sign, negative-controls, rule-knockout]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '交叉校验两套编排实现、逐批次校验完成证据（含产物摘要与依赖哈希），并归档为不可变制品；任一批次不通过则拒绝出包 (1/3)'
        run: |
          python3 scripts/batch.py crosscheck
      - name: '交叉校验两套编排实现、逐批次校验完成证据（含产物摘要与依赖哈希），并归档为不可变制品；任一批次不通过则拒绝出包 (2/3)'
        run: |
          python3 scripts/validate-all.py
      - name: '交叉校验两套编排实现、逐批次校验完成证据（含产物摘要与依赖哈希），并归档为不可变制品；任一批次不通过则拒绝出包 (3/3)'
        run: |
          python3 scripts/archive-evidence.py --out build/evidence-bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: evidence-archive-artifacts
          path: |
            build/evidence-bundle.tar.gz
          if-no-files-found: warn

  rule-knockout:
    name: '规则承重验证'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [governance]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '逐条抑制校验规则并重跑其覆盖测试，测试仍通过即说明该规则不承重 (1/1)'
        run: |
          python3 scripts/rule-knockout.py --out build/rule-knockout.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: rule-knockout-artifacts
          path: |
            build/rule-knockout.json
          if-no-files-found: warn

  release-gate:
    name: 'Release gate (fail closed)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [governance, build, unit-test, static-analysis, secret-scan, dependency-scan, container-scan, iac-scan, sbom, sign, negative-controls, evidence-archive, rule-knockout]
    if: always()
    steps:
      - name: 'Every required stage must have succeeded'
        run: |
          echo "needs result: ${{ join(needs.*.result, ',') }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == 'true' ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == 'true' ]] || \
             [[ "${{ contains(needs.*.result, 'skipped') }}" == 'true' ]]; then
            echo 'release gate blocked: a required stage did not succeed' >&2
            exit 1
          fi

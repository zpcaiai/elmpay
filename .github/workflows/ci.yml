  release-gate:
    name: 'Terminal release / validation gate (fail closed)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [governance, python-floor, build, unit-test, ios-sdk-test, flutter-sdk-test, quality-metrics, static-analysis, secret-scan, dependency-scan, container-scan, iac-scan, sbom, sign, negative-controls, evidence-archive, rule-knockout]
    if: always()
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.7'
      - name: 'Enforce release context or validation-only context'
        # Per-stage checks replace contains(needs.*.result, 'failure').
        # Per-stage diagnostics replace join(needs.*.result, ',').
        env:
          ELMPAY_GATE_EVENT_NAME: ${{ github.event_name }}
          ELMPAY_GATE_REPOSITORY: ${{ github.repository }}
          ELMPAY_GATE_REF: ${{ github.ref }}
          ELMPAY_GATE_SHA: ${{ github.sha }}
          ELMPAY_RELEASE_MANIFEST_B64: ${{ secrets.ELMPAY_RELEASE_MANIFEST_B64 }}
          ELMPAY_RELEASE_TRUST_B64: ${{ secrets.ELMPAY_RELEASE_TRUST_B64 }}
          ELMPAY_EXTERNAL_EVIDENCE_B64: ${{ secrets.ELMPAY_EXTERNAL_EVIDENCE_B64 }}
          ELMPAY_EXTERNAL_TRUST_B64: ${{ secrets.ELMPAY_EXTERNAL_TRUST_B64 }}
          ELMPAY_PRODUCT_IMAGE_INDEX_B64: ${{ secrets.ELMPAY_PRODUCT_IMAGE_INDEX_B64 }}
          ELMPAY_SIGNING_OPT_IN: ${{ vars.ELMPAY_PUBLIC_SIGSTORE_METADATA_DISCLOSURE_OPT_IN }}
          ELMPAY_NEEDS_GOVERNANCE: ${{ needs['governance'].result }}
          ELMPAY_NEEDS_PYTHON_FLOOR: ${{ needs['python-floor'].result }}
          ELMPAY_NEEDS_BUILD: ${{ needs['build'].result }}
          ELMPAY_NEEDS_UNIT_TEST: ${{ needs['unit-test'].result }}
          ELMPAY_NEEDS_IOS_SDK_TEST: ${{ needs['ios-sdk-test'].result }}
          ELMPAY_NEEDS_FLUTTER_SDK_TEST: ${{ needs['flutter-sdk-test'].result }}
          ELMPAY_NEEDS_QUALITY_METRICS: ${{ needs['quality-metrics'].result }}
          ELMPAY_NEEDS_STATIC_ANALYSIS: ${{ needs['static-analysis'].result }}
          ELMPAY_NEEDS_SECRET_SCAN: ${{ needs['secret-scan'].result }}
          ELMPAY_NEEDS_DEPENDENCY_SCAN: ${{ needs['dependency-scan'].result }}
          ELMPAY_NEEDS_CONTAINER_SCAN: ${{ needs['container-scan'].result }}
          ELMPAY_NEEDS_IAC_SCAN: ${{ needs['iac-scan'].result }}
          ELMPAY_NEEDS_SBOM: ${{ needs['sbom'].result }}
          ELMPAY_NEEDS_SIGN: ${{ needs['sign'].result }}
          ELMPAY_NEEDS_NEGATIVE_CONTROLS: ${{ needs['negative-controls'].result }}
          ELMPAY_NEEDS_EVIDENCE_ARCHIVE: ${{ needs['evidence-archive'].result }}
          ELMPAY_NEEDS_RULE_KNOCKOUT: ${{ needs['rule-knockout'].result }}
        run: |
          set -euo pipefail

          TRUSTED_EVENT="push"
          TRUSTED_REPOSITORY="zpcaiai/elmpay"
          TRUSTED_REF="refs/heads/main"
          REQUIRED_STAGES=(governance python-floor build unit-test ios-sdk-test flutter-sdk-test quality-metrics static-analysis secret-scan dependency-scan container-scan iac-scan sbom sign negative-controls evidence-archive rule-knockout)
          RELEASE_ONLY_STAGES=(sign evidence-archive)
          NON_RELEASE_REQUIRED_STAGES=(governance python-floor build unit-test ios-sdk-test flutter-sdk-test quality-metrics static-analysis secret-scan dependency-scan container-scan iac-scan sbom negative-controls rule-knockout)

          for variable in ELMPAY_GATE_EVENT_NAME ELMPAY_GATE_REPOSITORY ELMPAY_GATE_REF; do
            if [[ ! -v "${variable}" || -z "${!variable}" ]]; then
              echo "release gate blocked: required context '${variable}' is missing" >&2
              exit 1
            fi
          done

          stage_result() {
            local stage="$1"
            local variable="ELMPAY_NEEDS_${stage^^}"
            variable="${variable//-/_}"
            if [[ ! -v "${variable}" || -z "${!variable}" ]]; then
              echo "release gate blocked: result for '${stage}' is missing" >&2
              return 1
            fi
            printf '%s' "${!variable}"
          }

          if [[ "${ELMPAY_GATE_EVENT_NAME}" == "${TRUSTED_EVENT}" &&
                "${ELMPAY_GATE_REPOSITORY}" == "${TRUSTED_REPOSITORY}" &&
                "${ELMPAY_GATE_REF}" == "${TRUSTED_REF}" ]]; then
            if [[ "${ELMPAY_SIGNING_OPT_IN:-}" != 'true' ]]; then
              echo 'release gate blocked: public Sigstore metadata disclosure was not explicitly opted in' >&2
              exit 1
            fi
            for stage in "${REQUIRED_STAGES[@]}"; do
              result="$(stage_result "${stage}")"
              if [[ "${result}" != 'success' ]]; then
                echo "release gate blocked: required stage '${stage}' was '${result}'" >&2
                exit 1
              fi
            done
            for variable in ELMPAY_RELEASE_MANIFEST_B64 ELMPAY_RELEASE_TRUST_B64 \
                            ELMPAY_EXTERNAL_EVIDENCE_B64 ELMPAY_EXTERNAL_TRUST_B64 \
                            ELMPAY_PRODUCT_IMAGE_INDEX_B64 \
                            ELMPAY_GATE_SHA; do
              if [[ ! -v "${variable}" || -z "${!variable}" ]]; then
                echo "release gate blocked: protected evidence input '${variable}' is missing" >&2
                exit 1
              fi
            done
            python3 scripts/ci-release-evidence-gate.py
            echo 'release-eligible: trusted main push, all required stages and signed external evidence succeeded'
            exit 0
          fi

          for stage in "${RELEASE_ONLY_STAGES[@]}"; do
            result="$(stage_result "${stage}")"
            if [[ "${result}" != 'skipped' ]]; then
              echo "validation gate blocked: release-only stage '${stage}' unexpectedly ran as '${result}'" >&2
              exit 1
            fi
          done
          for stage in "${NON_RELEASE_REQUIRED_STAGES[@]}"; do
            result="$(stage_result "${stage}")"
            if [[ "${result}" != 'success' ]]; then
              echo "validation gate blocked: required stage '${stage}' was '${result}'" >&2
              exit 1
            fi
          done
          echo 'validated-not-release-eligible: validation succeeded; signing and release evidence were intentionally skipped'

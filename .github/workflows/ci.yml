      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '基础镜像与运行时层漏洞扫描，镜像必须摘要固定 (1/1)'
        run: |
          python3 -m tools.paygov.cli verify toolchain dev-platform --repo .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: container-scan-artifacts
          path: |
            container-scan.json
          if-no-files-found: warn

  iac-scan:
    name: '基础设施即代码扫描'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [governance]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: 'Kubernetes、Terraform 与 compose 的策略即代码检查 (1/1)'
        run: |
          python3 -m tools.paygov.cli verify dev-platform --repo .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: iac-scan-artifacts
          path: |
            iac-scan.json
          if-no-files-found: warn

  sbom:
    name: 'SBOM 生成'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0

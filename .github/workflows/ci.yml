# GENERATED FILE — do not edit by hand.
# Source of truth: governance/ci-pipeline.json
# Regenerate with: python3 scripts/render-ci.py

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  actions: none
  contents: read
  id-token: write
  packages: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  governance:
    name: '治理门禁'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (1/8)'
        run: |
          python3 .payment-platform/skill-package/scripts/verify_package.py
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (2/8)'
        run: |
          diff -qr .payment-platform/skill-package/skills .agents/skills
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (3/8)'
        run: |
          diff -qr .payment-platform/skill-package/skills .claude/skills
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (4/8)'
        run: |
          python3 -m tools.paygov.cli verify-all --repo .
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (5/8)'
        run: |
          python3 scripts/render-docs.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (6/8)'
        run: |
          python3 scripts/render-build.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (7/8)'
        run: |
          python3 scripts/render-dev-platform.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (8/8)'
        run: |
          python3 scripts/batch.py crosscheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: governance-artifacts
          path: |
            governance-report.json
          if-no-files-found: warn

  unit-test:
    name: '单元与属性测试'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [governance]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '编译并运行全部单元、属性与并发测试，禁止跳过关键测试 (1/2)'
        run: |
          python3 scripts/test-summary.py --out build/test-summary.json --log build/unittest.log
      - name: '编译并运行全部单元、属性与并发测试，禁止跳过关键测试 (2/2)'
        run: |
          ./gradlew --no-daemon test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: unit-test-artifacts
          path: |
            build/test-summary.json
            build/unittest.log
          if-no-files-found: warn

  build:
    name: '编译与制品构建'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

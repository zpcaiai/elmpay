# GENERATED FILE — do not edit by hand.
# Source of truth: governance/ci-pipeline.json
# Regenerate with: python3 scripts/render-ci.py

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  actions: none
  contents: read
  id-token: none
  packages: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  governance:
    name: '治理门禁'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (1/8)'
        run: |
          python3 .payment-platform/skill-package/scripts/verify_package.py
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (2/8)'
        run: |
          diff -qr .payment-platform/skill-package/skills .agents/skills
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (3/8)'
        run: |
          diff -qr .payment-platform/skill-package/skills .claude/skills
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (4/8)'
        run: |
          python3 -m tools.paygov.cli verify-all --repo . --out governance-report.json
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (5/8)'
        run: |
          python3 scripts/render-docs.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (6/8)'
        run: |
          python3 scripts/render-build.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (7/8)'
        run: |
          python3 scripts/render-dev-platform.py --check
      - name: '校验技能包镜像、章程、红线、模块边界、需求、威胁模型、工具链与本地平台声明 (8/8)'
        run: |
          python3 scripts/batch.py crosscheck
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: governance-artifacts
          path: |

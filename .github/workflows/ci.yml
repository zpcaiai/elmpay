      - name: '对全部 Gradle 项目执行已知漏洞聚合检查；数据源、分析或报告错误即失败 (1/2)'
        run: |
          python3 -m tools.paygov.nvdfeed --repo .
      - name: '对全部 Gradle 项目执行已知漏洞聚合检查；数据源、分析或报告错误即失败 (2/2)'
        run: |
          ./gradlew --no-daemon dependencyCheckAggregate
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        if: success() && github.event_name == 'push' && github.repository == 'zpcaiai/elmpay' && github.ref == 'refs/heads/main'
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0

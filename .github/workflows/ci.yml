    needs: [build]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: 'SAST、编译告警即错误、架构依赖规则检查 (1/2)'
        run: |
          ./gradlew --no-daemon check -x test
      - name: 'SAST、编译告警即错误、架构依赖规则检查 (2/2)'
        run: |
          python3 -m tools.paygov.cli verify module-registry --repo .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: static-analysis-artifacts
          path: |
            build/reports/
          if-no-files-found: warn

  secret-scan:
    name: '密钥扫描'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [governance]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '扫描源码、配置、测试夹具与制品中的凭证材料 (1/1)'
        run: |
          python3 -m tools.paygov.cli verify repo-hygiene --repo .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: secret-scan-artifacts
          path: |
            secret-scan.json
          if-no-files-found: warn

  dependency-scan:
    name: '依赖与供应链扫描'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244  # v4.3.1
        with:
          cache-read-only: true
      - name: '已知漏洞、许可证与来源校验；发现阻断级问题即失败 (1/1)'
        run: |
          ./gradlew --no-daemon dependencyCheckAnalyze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: dependency-scan-artifacts
          path: |
            build/reports/dependency-check-report.json
          if-no-files-found: warn

  container-scan:
    name: '容器镜像扫描'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:

name: Native quality diagnostics (original gates)

on:
  workflow_dispatch:
  push:
    branches: [codex/rr02-security-01a16bdf]

permissions:
  contents: read

concurrency:
  group: quality-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-java-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.9.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Preserve capacity and governance admission
        run: |
          python3 - <<'PY'
          import os, shutil
          assert os.getloadavg()[0] < 32
          assert shutil.disk_usage('.').free >= 8 * 1024**3
          PY
          python3 -m tools.paygov.cli verify-all --repo . --out build/quality-diagnostics/governance.json
      - name: Collect every original module failure and return the actual exit code
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('build/quality-diagnostics')
          root.mkdir(parents=True, exist_ok=True)
          command = ['./gradlew', '--no-daemon', '--console=plain', '--max-workers=2',
                     '--continue', 'qualityCoverageMutationReports']
          log = root / 'gradle.log'
          descriptor = os.open(log, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              child = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT)
              code = child.wait()
          receipt = {'command': command, 'executed': True, 'pid': child.pid,
                     'exit_code': code, 'path': str(log),
                     'sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
                     'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'scope': 'diagnostics only; original full CI remains required'}
          (root / 'execution.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: quality-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build/quality-diagnostics/
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/reports/pitest/mutations.xml
            **/build/test-results/test/*.xml
